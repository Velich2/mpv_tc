# Options for scripts/luts.lua
# Copy to ~/.config/mpv/script-opts/ (Windows: %APPDATA%\mpv\script-opts\)

# LUT folder; empty: the "luts" folder in every mpv config folder (yours, and the
# one shipped next to mpv.exe / inside mpv.app). Each subfolder is a submenu.
dir=
# Remember the chosen LUT across restarts (saved in luts.state)
remember=yes
# auto: on the GPU with --vo=gpu-next (.cube only), on the CPU while the
# DeckLink output is on (so the card gets the LUT too); gpu; cpu
mode=auto
# Key that opens the LUT menu, e.g. ctrl+l (empty: menu only)
key_menu=

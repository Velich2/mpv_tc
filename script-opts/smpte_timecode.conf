# Options for scripts/smpte_timecode.lua
# Copy to ~/.config/mpv/script-opts/ (Windows: %APPDATA%\mpv\script-opts\)

# Show the overlay at startup. With remember=yes, the last state set with
# Ctrl+T or the menu is used instead (saved in smpte_timecode.state).
enabled=yes
remember=yes
# top-left, top-center, top-right, bottom-left, bottom-center, bottom-right
position=top-right
font=monospace
# relative to a 720 px high OSD
font_size=36
margin=20
# RRGGBB
color=FFFFFF
border_color=000000
border_size=2
# second line: fps, DF/NDF, start timecode source
show_info=no

# Force the start timecode (empty = read it from the file)
start_tc=
# auto (from the start timecode: ';' = DF), yes, no. DF applies only to 29.97/59.94
drop_frame=auto
# 0 = auto
fps=0

use_ffprobe=yes
ffprobe_path=ffprobe
ffprobe_network=no

key_toggle=ctrl+t
